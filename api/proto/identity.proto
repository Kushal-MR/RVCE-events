syntax = "proto3";

package in.rvce.events.identity.v1;

import "models/user.proto";

option java_package = "in.rvce.events.identity.v1";
option java_multiple_files = true;

// 1. Sync on Google OAuth login
message SyncUserSessionRequest {
  string email = 1;
  string full_name = 2;
  string avatar_url = 3;
  string google_sub = 4;
}

message SyncUserSessionResponse {
  in.rvce.events.models.User user = 1;
  bool is_new_user = 2;
}

// 2. Profile Setup Modal Submission (USN & Department)
message UpdateStudentProfileRequest {
  string user_id = 1;
  string usn = 2;
  in.rvce.events.models.Department department = 3;
  int32 graduation_year = 4;
  string phone = 5;
}

message UpdateStudentProfileResponse {
  in.rvce.events.models.User user = 1;
}

// 3. Profile Fetch
message GetUserProfileRequest {
  string user_id = 1;
}

message GetUserProfileResponse {
  in.rvce.events.models.User user = 1;
}
