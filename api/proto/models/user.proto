syntax = "proto3";

package in.rvce.events.models;

option java_package = "in.rvce.events.models";
option java_multiple_files = true;

enum UserRole {
  ROLE_UNSPECIFIED = 0;
  ROLE_STUDENT = 1;
  ROLE_ORGANIZER = 2;
  ROLE_FACULTY_ADMIN = 3;
}

enum ProfileStatus {
  PROFILE_STATUS_UNSPECIFIED = 0;
  PROFILE_STATUS_PENDING = 1;     // Logged in via Google; USN & Department not filled
  PROFILE_STATUS_PARTIAL = 2;     // Partial details provided (e.g. USN filled, awaiting verification)
  PROFILE_STATUS_COMPLETE = 3;    // Fully onboarded with valid USN & Department
  PROFILE_STATUS_SUSPENDED = 4;   // Account temporarily locked or restricted
}

enum Department {
  DEPARTMENT_UNSPECIFIED = 0;
  DEPARTMENT_AE = 1;              // Aerospace Engineering
  DEPARTMENT_AIML = 2;            // Artificial Intelligence & Machine Learning
  DEPARTMENT_BT = 3;              // Biotechnology
  DEPARTMENT_CD = 4;              // Computer Science & Design
  DEPARTMENT_CH = 5;              // Chemical Engineering
  DEPARTMENT_CSE = 6;             // Computer Science & Engineering
  DEPARTMENT_CV = 7;              // Civil Engineering
  DEPARTMENT_CY = 8;              // Computer Science & Cybersecurity
  DEPARTMENT_ECE = 9;             // Electronics & Communication Engineering
  DEPARTMENT_EE = 10;             // Electrical & Electronics Engineering
  DEPARTMENT_EI = 11;             // Electronics & Instrumentation Engineering
  DEPARTMENT_ETE = 12;            // Electronics & Telecommunication Engineering
  DEPARTMENT_IEM = 13;            // Industrial Engineering & Management
  DEPARTMENT_ISE = 14;            // Information Science & Engineering
  DEPARTMENT_MECH = 15;           // Mechanical Engineering
}

message User {
  string id = 1;                  // Internal UUID
  string email = 2;               // Must end with @rvce.edu.in
  string full_name = 3;
  string avatar_url = 4;
  UserRole role = 5;
  ProfileStatus profile_status = 6;

  // Student Profile fields (from ProfileSetupModal)
  string usn = 7;                 // e.g. "1RV22CS045" or "1RZ22CS045"
  Department department = 8;
  int32 graduation_year = 9;      // e.g. 2026
  string phone = 10;              // Optional 10-digit phone
}
