syntax = "proto3";

package in.rvce.events.v1;

import "identity.proto";

option java_package = "in.rvce.events.v1";
option java_multiple_files = true;

// Unified backend service interface
service BackendService {
  // --- Identity & User Profile ---
  rpc SyncUserSession (in.rvce.events.identity.v1.SyncUserSessionRequest) 
      returns (in.rvce.events.identity.v1.SyncUserSessionResponse);

  rpc UpdateStudentProfile (in.rvce.events.identity.v1.UpdateStudentProfileRequest) 
      returns (in.rvce.events.identity.v1.UpdateStudentProfileResponse);

  rpc GetUserProfile (in.rvce.events.identity.v1.GetUserProfileRequest) 
      returns (in.rvce.events.identity.v1.GetUserProfileResponse);
}
